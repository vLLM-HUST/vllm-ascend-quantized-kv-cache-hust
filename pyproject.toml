[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-ascend-quantized-kv-cache"
description = "Runtime-loadable INT8 KV-cache attention backend for vLLM-Ascend-HUST"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

# Runtime plugin hook. It registers the backend; --kv-cache-dtype int8 is the
# explicit activation switch.
[project.entry-points."vllm.general_plugins"]
"vllm-ascend-int8-kv-cache" = "vllm_ascend_quantized_kv_cache.bootstrap:register_plugins"

# Checkpoint injection tool: writes the complete ModelSlim-style
# quantization_config (fa_quant_type dispatch) — see docs/how-to-run.md §6.2.
[project.scripts]
"vllm-hust-kv-inject" = "vllm_ascend_quantized_kv_cache.tools.checkpoint:main"
# Read-only environment/readiness diagnosis — see docs/how-to-run.md §2.
"vllm-hust-kv-doctor" = "vllm_ascend_quantized_kv_cache.tools.doctor:main"
# Evidence record validator (docs/acceptance-matrix.md discipline).
"vllm-hust-kv-evidence" = "vllm_ascend_quantized_kv_cache.tools.evidence:main"

[tool.hatch.version]
path = "src/vllm_ascend_quantized_kv_cache/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_ascend_quantized_kv_cache"]

[tool.hatch.build]
exclude = ["src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
