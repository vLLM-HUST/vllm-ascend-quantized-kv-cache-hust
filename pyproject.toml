[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-ascend-quantized-kv-cache"
description = "Runtime-loadable INT8 and INT4 (KIVI) KV-cache attention backends for vLLM-Ascend-HUST"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

# Runtime plugin hook. It registers the backends; --kv-cache-dtype int8 or
# kivi_int4 is the explicit activation switch.
[project.entry-points."vllm.general_plugins"]
"vllm-ascend-quantized-kv-cache" = "vllm_ascend_quantized_kv_cache.bootstrap:register_plugins"

[tool.hatch.version]
path = "src/vllm_ascend_quantized_kv_cache/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_ascend_quantized_kv_cache"]

[tool.hatch.build]
exclude = ["src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
