[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vllm-ascend-quantized-kv-cache"
description = "Runtime-loadable INT8 KV-cache attention backend for vLLM-Ascend-HUST"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

# Runtime plugin hook. It registers the backend; --kv-cache-dtype int8 is the
# explicit activation switch.
[project.entry-points."vllm.general_plugins"]
"vllm-ascend-int8-kv-cache" = "vllm_ascend_quantized_kv_cache.bootstrap:register_plugins"

# Static discovery hook for vLLM-HUST Extension Manager.  Discovery reads the
# manifest without importing this package; runtime registration remains on the
# official vLLM general-plugin hook above.
[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.ascend-int8-kv-cache" = "vllm_ascend_quantized_kv_cache.extension_manager_manifest"

[tool.hatch.version]
path = "src/vllm_ascend_quantized_kv_cache/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_ascend_quantized_kv_cache"]

[tool.hatch.build]
exclude = [
  ".venv/",
  "venv/",
  ".release-venv/",
  ".release-smoke/",
  "src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/vllm_ascend_quantized_kv_cache/BidKV打包与发布指南.md"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
