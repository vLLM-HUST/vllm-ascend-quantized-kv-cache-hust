name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Verify wheel contents
        run: bash scripts/verify-wheel.sh dist/*.whl
      - name: Isolated smoke install
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir dist/*.whl
          .release-smoke/bin/python -c "
          import importlib.metadata as im
          from vllm_ascend_quantized_kv_cache import kv_methods, __version__
          assert im.version('vllm-ascend-quantized-kv-cache') == __version__
          names = kv_methods.list()
          assert names == ['int8_dynamic']
          method = kv_methods.get('int8_dynamic', head_size=128)
          assert method.resolve_layout().storage_dtype == 'int8'
          print('smoke OK:', names)
          "
      - name: Validate Bundle v1 manifest
        run: |
          python -c "import json; p=json.load(open('src/vllm_ascend_quantized_kv_cache/manifests/vllm-hust-extension-v1.json')); assert p['schema_version']=='1.0'; assert p['host']=={'provider':'vllm','name':'vllm-ascend-hust'}; assert len(p['components'])==1"
