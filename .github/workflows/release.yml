name: Release to PyPI

# Tag-triggered publication following the BidKV packaging and release guide:
#   uv build --no-sources -> verify wheel -> uv publish -> smoke install
# The first published version must be gated by a maintainer (see
# MAINTAINERS.md: release approval is owner-led).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record provenance
        run: |
          git log -1 --format="commit %H%nsubject %s" | tee dist-provenance.txt
          echo "tag ${GITHUB_REF}" >> dist-provenance.txt
      - name: Install uv
        run: python -m pip install uv
      - name: Verify release versions
        shell: bash
        run: |
          package_version="$(python -c 'from pathlib import Path; ns = {}; exec(Path("src/vllm_ascend_quantized_kv_cache/_version.py").read_text(), ns); print(ns["__version__"])')"
          manifest_version="$(python -c 'import json; print(json.load(open("src/vllm_ascend_quantized_kv_cache/manifests/vllm-hust-extension-v1.json"))["bundle_version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$manifest_version" || {
            echo "Package version $package_version does not match manifest version $manifest_version"
            exit 1
          }
          test "$package_version" = "$tag_version" || {
            echo "Package version $package_version does not match tag version $tag_version"
            exit 1
          }
      - name: Build distributions
        run: uv build --no-sources --out-dir dist
      - name: Verify wheel contents
        run: bash scripts/verify-wheel.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        run: python -m pip install uv
      - name: Publish to PyPI (intellistream org project token)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="dist/vllm_ascend_quantized_kv_cache-${version}-py3-none-any.whl"
          sdist="dist/vllm_ascend_quantized_kv_cache-${version}.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          uv publish \
            --check-url https://pypi.org/simple \
            "$wheel" \
            "$sdist"
      - name: Smoke install from PyPI (no cache)
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir \
            "vllm-ascend-quantized-kv-cache==${GITHUB_REF_NAME#v}"
          .release-smoke/bin/python -c "
          from vllm_ascend_quantized_kv_cache import kv_methods, __version__
          assert __version__ == '${GITHUB_REF_NAME#v}', __version__
          assert kv_methods.list() == ['int8_dynamic']
          assert kv_methods.get('int8_dynamic').resolve_layout().storage_dtype == 'int8'
          print('PyPI smoke OK:', __version__)
          "
