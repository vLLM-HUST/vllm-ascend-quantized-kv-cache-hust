name: Release to PyPI

# Tag-triggered publication following the vLLM-HUST packaging and release
# guide (operations/bidkv-packaging-and-release-guide.md):
#   uv build --no-sources -> verify wheel -> uv publish -> smoke install
# The first published version must be gated by a maintainer (see
# MAINTAINERS.md: release approval is owner-led).

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record provenance
        run: |
          git log -1 --format="commit %H%nsubject %s" | tee dist-provenance.txt
          echo "tag ${GITHUB_REF}" >> dist-provenance.txt
      - name: Install uv and build tool
        run: python -m pip install uv build
      - name: Build distributions
        run: uv build --no-sources --out-dir dist
      - name: Verify wheel contents
        run: bash scripts/verify-wheel.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; falls back to token below
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install uv
        run: python -m pip install uv
      - name: Publish to PyPI (intellistream org project token)
        if: ${{ secrets.UV_PUBLISH_TOKEN != '' }}
        run: |
          uv publish \
            --check-url https://pypi.org/simple/vllm-ascend-quantized-kv-cache/ \
            --token "pypi-${{ secrets.UV_PUBLISH_TOKEN }}" \
            dist/*
      - name: Smoke install from PyPI (no cache)
        if: ${{ secrets.UV_PUBLISH_TOKEN != '' }}
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir \
            "vllm-ascend-quantized-kv-cache==${GITHUB_REF_NAME#v}"
          .release-smoke/bin/python -c "
          from vllm_ascend_quantized_kv_cache import kv_methods, __version__
          assert __version__ == '${GITHUB_REF_NAME#v}', __version__
          assert kv_methods.list() == ['int8_dynamic']
          assert kv_methods.get('int8_dynamic').resolve_layout().storage_dtype == 'int8'
          print('PyPI smoke OK:', __version__)
          "
