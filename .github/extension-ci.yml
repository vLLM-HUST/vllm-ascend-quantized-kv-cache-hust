name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@main"
      - run: python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - name: Verify wheel contents
        run: bash scripts/verify-wheel.sh dist/*.whl
      - name: Isolated smoke install
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --no-cache-dir dist/*.whl
          .release-smoke/bin/python -c "
          import importlib.metadata as im
          assert im.version('vllm-ascend-quantized-kv-cache') == '0.2.0.dev0'
          from vllm_ascend_quantized_kv_cache import kv_solutions, __version__
          assert __version__ == '0.2.0.dev0'
          names = kv_solutions.list()
          assert 'kivi_int4' in names and 'int8_dynamic' in names
          sol = kv_solutions.get('kivi_int4', head_size=128)
          assert sol.resolve_layout().storage_dtype == 'uint8'
          print('smoke OK:', names)
          "
      - name: Extension Manager discovery
        run: vllm-hust-ext extension inspect org.vllm-hust.quantized-kv-cache
